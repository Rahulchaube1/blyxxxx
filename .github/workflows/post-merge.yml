name: Post-merge Verification

on:
  push:
    branches:
      - blyx-main

permissions:
  contents: read

jobs:
  verify:
    name: Verify merged source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        run: cargo test --workspace
