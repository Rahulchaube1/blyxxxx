name: Blyx Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macOS ARM64
            target: aarch64-apple-darwin
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and test the compiler
        run: |
          cargo test --locked -p blyxc
          cargo build --locked --release -p blyxc --target ${{ matrix.target }}

      - name: Package standalone CLI
        shell: bash
        run: |
          mkdir -p dist
          release_dir="target/${{ matrix.target }}/release"
          filename="blyx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd "$release_dir" && 7z a "$GITHUB_WORKSPACE/dist/$filename.zip" blyxc.exe)
          else
            tar -czf "dist/$filename.tar.gz" -C "$release_dir" blyxc
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blyx-${{ matrix.target }}
          path: dist/

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package editor extension
        working-directory: source/editors/code
        run: |
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out "$GITHUB_WORKSPACE/dist/blyx-language-$version.vsix"

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.vsix > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
