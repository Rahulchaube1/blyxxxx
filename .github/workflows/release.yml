name: Blyx Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macOS ARM64
            target: aarch64-apple-darwin
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build workspace
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/blyx-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" "target/${{ matrix.target }}/release/*"
          else
            tar -czf "dist/blyx-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" .
          fi

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blyx-${{ matrix.target }}
          path: dist/

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
