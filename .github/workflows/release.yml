name: Blyx Release Automation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: blyx-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: blyx-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: blyx-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Workspace Release Binaries
        run: cargo build --workspace --release

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          sha256sum Cargo.lock > checksums.txt || shasum -a 256 Cargo.lock > checksums.txt

      - name: Publish GitHub Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
