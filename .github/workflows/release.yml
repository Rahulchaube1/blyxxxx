name: Blyx Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing release tag to rebuild as workflow artifacts
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            name: macOS ARM64
            target: aarch64-apple-darwin
          - os: windows-latest
            name: Windows x86_64
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and test the compiler
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cargo test --locked -p blyxc
          cargo build --locked --release -p blyxc --bin blyxc --target ${{ matrix.target }}

      - name: Verify the standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/blyxc.exe').Path
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'Could not locate dumpbin for the dependency check' }
          $deps = & $dumpbin /nologo /dependents $cli
          if ($LASTEXITCODE -ne 0 -or !($deps -match '(?i)kernel32\.dll')) { throw 'Could not inspect PE dependencies' }
          $deps | Write-Output
          if ($deps -match '(?i)^\s*(vcruntime|msvcp\d|msvcr\d|api-ms-win-crt-|ucrtbase).*\.dll') { throw 'The Windows binary still imports a shared C/C++ runtime' }
          $version = (Get-Content compiler/blyxc/Cargo.toml | Select-String '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ((& $cli --version) -ne "blyxc $version" -or $LASTEXITCODE -ne 0) { throw 'Unexpected CLI version' }
          $output = (& $cli run examples/ml/linear_fit.blyx) -join ','
          if ($LASTEXITCODE -ne 0 -or $output -ne '2,10') { throw "Unexpected linear-fit output: $output" }

      - name: Package standalone CLI
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.source_tag || github.ref_name }}
        run: |
          mkdir -p dist
          release_dir="target/${{ matrix.target }}/release"
          filename="blyx-${RELEASE_REF}-${{ matrix.target }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd "$release_dir" && 7z a "$GITHUB_WORKSPACE/dist/$filename.zip" blyxc.exe)
          else
            tar -czf "dist/$filename.tar.gz" -C "$release_dir" blyxc
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blyx-${{ matrix.target }}
          path: dist/

  publish:
    name: Publish GitHub release
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Package editor extension
        working-directory: source/editors/code
        run: |
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out "$GITHUB_WORKSPACE/dist/blyx-language-$version.vsix"

      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.vsix > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
