name: Publish Blyx framework editors
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blyx-framework-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Rahulchaube1/blyxxxx' && github.ref == 'refs/heads/blyx-main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: framework-editors
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Download the catalogued VSIX files and check their contents
        run: python3 tools/publish-framework-editors.py download
      - name: Install the Marketplace CLI
        run: npm install --prefix "$RUNNER_TEMP/blyx-publisher" --no-audit --no-fund @vscode/vsce@4.1.1
      - name: Publish the verified packages using Microsoft federated identity
        run: python3 tools/publish-framework-editors.py publish
