name: Publish Blyx editor extension
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Extension registry
        required: true
        type: choice
        options: [both, marketplace, open-vsx]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(inputs.registry == 'both' && '["marketplace","open-vsx"]' || format('["{0}"]', inputs.registry)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the released VSIX and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./editors/code/package.json').version")
          tag="editor-v$version"
          if ! gh release view "$tag" >/dev/null; then
            tag=$(sed -n 's/^version = "\([^"]*\)"/v\1/p' compiler/blyxc/Cargo.toml | head -1)
          fi
          gh release download "$tag" -p "blyx-language-$version.vsix" -p SHA256SUMS -D "$RUNNER_TEMP/editor"
          cd "$RUNNER_TEMP/editor"
          sha256sum --check --ignore-missing SHA256SUMS
          echo "PACKAGE=$PWD/blyx-language-$version.vsix" >> "$GITHUB_ENV"
      - name: Publish to Visual Studio Marketplace
        if: matrix.registry == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          flags=()
          if [[ -z "$VSCE_PAT" ]]; then flags+=(--oidc); fi
          npx --yes @vscode/vsce@4.1.1 publish --packagePath "$PACKAGE" "${flags[@]}"
      - name: Publish to Open VSX
        if: matrix.registry == 'open-vsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          flags=()
          if [[ -z "$OVSX_PAT" ]]; then flags+=(--trusted-publishing); fi
          npx --yes ovsx@1.4.0 publish "$PACKAGE" "${flags[@]}"
