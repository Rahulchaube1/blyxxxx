name: Format

on:
  push:
    branches: [blyx-main]
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "rustfmt.toml"

permissions:
  contents: write

concurrency:
  group: format-blyx-main
  cancel-in-progress: true

jobs:
  format:
    name: Format source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blyx-main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --all

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin HEAD:blyx-main
