name: Blyx CI

on:
  pull_request:
  push:
    branches:
      - blyx-main

permissions:
  contents: read

concurrency:
  group: blyx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  cross-platform:
    name: Cross-platform build and interpreter tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Test interpreter
        run: cargo test --locked -p blyxc

      - name: Test release arithmetic
        run: cargo test --locked -p blyxc --release

      - name: Run Fibonacci example
        run: cargo run --locked -p blyxc -- run examples/basic/fibonacci.blyx

      - name: Run mutation and loops example
        run: cargo run --locked -p blyxc -- run examples/basic/loops.blyx

  editor:
    name: Check packaged WebAssembly runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node editors/code/scripts/prepare.cjs
      - run: node tools/test-blyx-grammar.cjs
      - run: node --test tools/test-blyx-adoption-audit.mjs
      - run: node --test tools/test-live-downloads.mjs
      - run: node --test tools/test-blyx-grammar-export.mjs
      - run: node tools/test-editor-runtime.mjs
      - run: node tools/export-handbook.mjs --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p blyxc --lib
      - run: |
          cp target/wasm32-unknown-unknown/release/blyxc.wasm website/public/runtime/blyx.wasm
          node editors/code/scripts/prepare.cjs
          node tools/test-editor-runtime.mjs
