name: Update public adoption counters
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
concurrency:
  group: adoption-history
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: adoption-history
          path: history
      - run: python tools/adoption.py history/adoption.json
      - working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- adoption.json
          git diff --cached --quiet || git commit -m "Record public Blyx distribution counters"
          git push origin HEAD:adoption-history
