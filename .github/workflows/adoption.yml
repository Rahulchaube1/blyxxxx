name: Update public adoption counters
on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: adoption-history
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: adoption-history
          path: history
      - name: Collect ecosystem-wide downloads and installs
        if: github.event.schedule != '23 2 * * *'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ecosystem_downloads.py history/ecosystem.json
      - name: Collect daily language and framework history
        if: github.event.schedule == '23 2 * * *' || github.event_name == 'workflow_dispatch'
        run: python tools/adoption.py history/adoption.json
      - working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- adoption.json
          if test -f ecosystem.json; then git add -- ecosystem.json; fi
          git diff --cached --quiet || git commit -m "Record public Blyx distribution counters"
          git push origin HEAD:adoption-history
