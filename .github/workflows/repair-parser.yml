name: Repair parser

on:
  push:
    branches: [blyx-main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: blyx-main
          fetch-depth: 0
      - name: Repair boolean token handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("compiler/blyx_parser/src/lib.rs")
          text = path.read_text()
          old_prefix = '''            TokenKind::True => {\n                self.advance();\n                Expr::Literal(Lit::Bool(true), t.span)\n            }\n            TokenKind::False => {\n                self.advance();\n                Expr::Literal(Lit::Bool(false), t.span)\n            }'''
          new_prefix = '''            TokenKind::BoolLit(value) => {\n                self.advance();\n                Expr::Literal(Lit::Bool(value), t.span)\n            }'''
          old_pattern = '''            TokenKind::True => {\n                self.advance();\n                Pattern::Literal(Lit::Bool(true), t.span)\n            }\n            TokenKind::False => {\n                self.advance();\n                Pattern::Literal(Lit::Bool(false), t.span)\n            }'''
          new_pattern = '''            TokenKind::BoolLit(value) => {\n                self.advance();\n                Pattern::Literal(Lit::Bool(value), t.span)\n            }'''
          if old_prefix not in text or old_pattern not in text:
              raise SystemExit("Expected parser boolean branches were not found")
          text = text.replace(old_prefix, new_prefix, 1)
          text = text.replace(old_pattern, new_pattern, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/blyx_parser/src/lib.rs
          git commit -m "fix: parse boolean literals" || exit 0
          git push origin HEAD:blyx-main
