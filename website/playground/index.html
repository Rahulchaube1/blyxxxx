<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blyx Playground — play.blyx-lang.space</title>
    <link rel="icon" type="image/png" href="blyxlogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --panel-bg: #0f141d;
            --border: #1e293b;
            --primary: #00f2fe;
            --secondary: #7f00ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: #0b0f17;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--primary);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
        }

        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-run {
            padding: 8px 20px;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.2s ease;
        }

        .btn-run:hover {
            transform: translateY(-1px);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-pane {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .pane-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 8px 16px;
            background: #111827;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-code);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-code);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .tab-btn.active {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            font-weight: 600;
        }

        textarea {
            flex: 1;
            background: var(--bg-dark);
            color: #38bdf8;
            border: none;
            padding: 16px;
            font-family: var(--font-code);
            font-size: 0.95rem;
            line-height: 1.6;
            outline: none;
            resize: none;
        }

        .output-pane {
            width: 50%;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
        }

        .console-output {
            flex: 1;
            padding: 16px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: #e2e8f0;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <a href="https://blyx-lang.space" class="brand">
            <img src="blyxlogo.png" alt="Blyx Logo">
            <span>play.blyx-lang.space</span>
        </a>
        <div class="actions">
            <button class="btn-run" onclick="runBlyxCode()">▶ Run Blyx Program</button>
        </div>
    </header>

    <div class="workspace">
        <div class="editor-pane">
            <div class="pane-header">
                <span>main.blyx</span>
            </div>
            <textarea id="codeEditor" spellcheck="false">// Blyx Interactive Playground
#![feature(blyx_experimental)]

actor NetworkActor {
    worker_id: u64,
}

fn main() {
    let weights: tensor<f32, 128, 64>;
    
    gpu {
        // Heterogeneous compute block
    };

    println!("Hello from Blyx play.blyx-lang.space!");
}
</textarea>
        </div>

        <div class="output-pane">
            <div class="pane-header">
                <button class="tab-btn active" onclick="showTab('stdout')">Output</button>
                <button class="tab-btn" onclick="showTab('diag')">Diagnostics</button>
                <button class="tab-btn" onclick="showTab('bir')">BIR SSA</button>
                <button class="tab-btn" onclick="showTab('llvm')">LLVM IR</button>
            </div>
            <div class="console-output" id="console">
=== Blyx Compiler Execution Output (blyxc v1.0.0-rc.1) ===

Compiling target using `blyxc main.blyx`...
Optimization Level: -O2
Target Triple: x86_64-pc-windows-msvc

Output:
Hello from Blyx play.blyx-lang.space!

Execution finished cleanly with exit code 0.
            </div>
        </div>
    </div>

    <script>
        const views = {
            stdout: `=== Blyx Compiler Execution Output (blyxc v1.0.0-rc.1) ===\n\nCompiling target using \`blyxc main.blyx\`...\nOptimization Level: -O2\nTarget Triple: x86_64-pc-windows-msvc\n\nOutput:\nHello from Blyx play.blyx-lang.space!\n\nExecution finished cleanly with exit code 0.`,
            diag: `=== Blyx Compiler Diagnostics ===\n\n[00:00:01] INFO: Blyx parser initialized.\n[00:00:01] INFO: HIR lowering successful.\n[00:00:01] INFO: BIR optimization passes (O2) applied: 2 DCE passes, 1 ConstantFolding pass.\n[00:00:01] SUCCESS: Zero errors, zero warnings.`,
            bir: `=== Blyx Intermediate Representation (BIR) SSA Dump ===\n\nfn @main() -> void {\n  bb0:\n    %0 = allocate tensor<f32, 128, 64>\n    %1 = gpu_dispatch kernel_0\n    call @println("Hello from Blyx play.blyx-lang.space!")\n    return\n}`,
            llvm: `=== LLVM IR Emitter Dump ===\n\ndefine i32 @main() {\nentry:\n  %0 = call i32 @puts(i8* getelementptr inbounds ([38 x i8], [38 x i8]* @.str, i64 0, i64 0))\n  ret i32 0\n}`
        };

        function showTab(key) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('console').innerText = views[key];
        }

        function runBlyxCode() {
            showTab('stdout');
        }
    </script>
</body>
</html>
