[package]
name = "blyxc"
version = "0.2.0"
edition = "2024"
description = "Official Compiler Driver for the Blyx Programming Language"

[dependencies]
blyx_lexer = { path = "../blyx_lexer" }
blyx_parser = { path = "../blyx_parser" }
blyx_ast = { path = "../blyx_ast" }

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
