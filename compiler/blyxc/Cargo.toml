[package]
name = "blyxc"
version = "0.2.3"
edition = "2024"
description = "Official Compiler Driver for the Blyx Programming Language"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
exclude = ["tests/repository_examples.rs"]

[dependencies]
blyx_lexer = { version = "0.1.0", path = "../blyx_lexer" }
blyx_parser = { version = "0.1.0", path = "../blyx_parser" }
blyx_ast = { version = "0.1.0", path = "../blyx_ast" }

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
